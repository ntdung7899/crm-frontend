name: ${ENVIRONMENT_NAME}-${PROJECT_NAME}

services:
  app:
    container_name: ${ENVIRONMENT_NAME}-${PROJECT_NAME}
    image: ${APP_IMAGE}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    ports:
      - "${PORT_APP}:3002"
    networks:
      - meu-solutions-product-alpha-net

networks:
  meu-solutions-product-alpha-net:
    external: true
    name: meu-solutions-product-alpha-net